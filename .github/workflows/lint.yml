name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create .env file from example
        run: cp .env.example .env

      - name: Build Project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Type Check
        run: npx astro check --fail-on-warnings false
