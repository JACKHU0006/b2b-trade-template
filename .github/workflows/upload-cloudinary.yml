name: Upload Images to Cloudinary

on:
  push:
    branches:
      - main
    paths:
      - 'public/images/**'
      - '.github/workflows/upload-cloudinary.yml'

  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install cloudinary

      - name: Upload images to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          node - << 'EOF'
          const cloudinary = require('cloudinary').v2;
          const fs = require('fs');
          const path = require('path');
          
          cloudinary.config({
            cloud_name: process.env.CLOUDINARY_CLOUD_NAME,
            api_key: process.env.CLOUDINARY_API_KEY,
            api_secret: process.env.CLOUDINARY_API_SECRET
          });
          
          async function uploadImages() {
            const baseDir = 'public/images';
            const files = fs.readdirSync(baseDir, { recursive: true });
            
            for (const file of files) {
              if (fs.lstatSync(path.join(baseDir, file)).isFile() && 
                  !file.startsWith('.') && 
                  /\.(jpg|jpeg|png|svg|webp|gif)$/i.test(file)) {
                const filePath = path.join(baseDir, file);
                const publicId = `fabletech/${file.replace(/\\/g, '/').replace(/^public\//, '')}`;
                
                try {
                  console.log(`Uploading: ${file}`);
                  await cloudinary.uploader.upload(filePath, {
                    public_id: publicId,
                    overwrite: true,
                    invalidate: true
                  });
                  console.log(`✅ Uploaded: ${file}`);
                } catch (error) {
                  console.error(`❌ Failed: ${file}`, error.message);
                }
              }
            }
            
            console.log('\n✅ Upload complete!');
          }
          
          uploadImages().catch(console.error);
          EOF

      - name: Output CDN URLs
        run: |
          echo ""
          echo "======================================"
          echo "✅ Images uploaded to Cloudinary!"
          echo "Base URL: https://res.cloudinary.com/${{ secrets.CLOUDINARY_CLOUD_NAME }}/image/upload/fabletech"
          echo "======================================"
