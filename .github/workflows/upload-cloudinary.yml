name: Upload Images to Cloudinary

on:
  push:
    branches:
      - main
    paths:
      - 'public/images/**'
      - '.github/workflows/upload-cloudinary.yml'

  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install cloudinary

      - name: Upload images to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          node - << 'EOF'
          const cloudinary = require('cloudinary').v2;
          const fs = require('fs');
          const path = require('path');
          
          cloudinary.config({
            cloud_name: process.env.CLOUDINARY_CLOUD_NAME,
            api_key: process.env.CLOUDINARY_API_KEY,
            api_secret: process.env.CLOUDINARY_API_SECRET
          });
          
          function getAllFiles(dir, fileList = []) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const filePath = path.join(dir, file);
              const stat = fs.lstatSync(filePath);
              if (stat.isDirectory()) {
                getAllFiles(filePath, fileList);
              } else {
                fileList.push(filePath);
              }
            }
            return fileList;
          }
          
          async function uploadImages() {
            const baseDir = 'public/images';
            const allFiles = getAllFiles(baseDir);
            const imageExtensions = ['.jpg', '.jpeg', '.png', '.svg', '.webp', '.gif'];
            
            for (const file of allFiles) {
              const ext = path.extname(file).toLowerCase();
              if (!imageExtensions.includes(ext)) continue;
              
              const relativePath = file.replace(/^public\//, '');
              const publicId = `fabletech/${relativePath}`;
              
              try {
                console.log(`Uploading: ${relativePath}`);
                await cloudinary.uploader.upload(file, {
                  public_id: publicId,
                  overwrite: true,
                  invalidate: true
                });
                console.log(`✅ Uploaded: ${relativePath}`);
              } catch (error) {
                console.error(`❌ Failed: ${relativePath}`, error.message);
              }
            }
            
            console.log('\n✅ Upload complete!');
          }
          
          uploadImages().catch(console.error);
          EOF

      - name: Output CDN URLs
        run: |
          echo ""
          echo "======================================"
          echo "✅ Images uploaded to Cloudinary!"
          echo "Base URL: https://res.cloudinary.com/${{ secrets.CLOUDINARY_CLOUD_NAME }}/image/upload/fabletech"
          echo "======================================"
