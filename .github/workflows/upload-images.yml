name: Upload Images to Cloudflare R2

on:
  push:
    branches:
      - main
    paths:
      - 'public/images/**'
      - '.github/workflows/upload-images.yml'

  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: auto
          aws-endpoint-url: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Sync images to R2
        run: |
          aws s3 sync ./public/images/ s3://${{ secrets.R2_BUCKET_NAME }}/images/ \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.git/*" \
            --exclude "*.gitignore"

      - name: Create cache busting manifest
        run: |
          echo "${{ github.sha }}" > version.txt
          aws s3 cp version.txt s3://${{ secrets.R2_BUCKET_NAME }}/version.txt

      - name: Output CDN URL
        run: |
          echo "Images uploaded to R2!"
          echo "CDN URL: https://${{ secrets.CDN_DOMAIN }}/images/"
